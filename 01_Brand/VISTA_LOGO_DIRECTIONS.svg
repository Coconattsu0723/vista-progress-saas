  <text x="96" y="126" class="sans" font-size="30" font-weight="700" fill="#FFFFFF">See the flow. Spot what stops.</text>
  <text x="1504" y="96" text-anchor="end" class="sans" font-size="16" fill="#98A2B3">B2B SaaS / Clean Tech</text>

  <!-- A -->
  <g filter="url(#shadow)">
    <rect x="80" y="216" width="1440" height="244" rx="24" fill="#FFFFFF"/>
