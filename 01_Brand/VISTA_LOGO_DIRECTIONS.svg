    <path d="M8 58H42C55 58 60 28 75 28H126" fill="none" stroke="#60A5FA" stroke-width="9" stroke-linecap="round"/>
    <path d="M8 92H46C59 92 65 122 80 122H126" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
