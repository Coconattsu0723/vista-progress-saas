    <circle cx="80" cy="122" r="9" fill="#EF4444"/>
    <path d="M115 17L132 28L115 39 M115 111L132 122L115 133" fill="none" stroke="#182230" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
