<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .sans { font-family: Inter, Arial, sans-serif; }
      .jp { font-family: Inter, Arial, sans-serif; }
      .label { font-size: 18px; font-weight: 700; letter-spacing: 2px; fill: #2563EB; }
      .title { font-size: 34px; font-weight: 750; fill: #182230; }
      .body { font-size: 18px; font-weight: 400; fill: #667085; }
      .wordmark { font-size: 54px; font-weight: 760; letter-spacing: 7px; fill: #182230; }
      .wordmark-light { font-size: 32px; font-weight: 760; letter-spacing: 5px; fill: #FFFFFF; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#101828" flood-opacity="0.08"/>
